<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 写作工作台 - 文芽作文</title>
<meta name="description" content="文芽作文 AI 写作工作台：输入题目与接口，AI 先回应你，再把作文逐字写进方格稿纸。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/write.css?v=20261112">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">文</span>
      <span>文芽作文</span>
    </a>
  </div>
</header>

<main class="wrap">

  <div class="tool-head">
    <div>
      <h1>AI 写作工作台<span class="badge-new">核心功能</span></h1>
      <p>输入题目与接口，AI 先回应你，再把作文逐字写进方格稿纸。</p>
    </div>
    <button class="btn btn-ghost" id="toggleConfig" aria-expanded="false">接口配置</button>
  </div>

  <section class="config-panel" id="configPanel" hidden>
    <div class="config-grid">
      <div>
        <div class="config-note">
          <strong>密钥只存在本机浏览器</strong>，不会上传到本站 —— 本站是纯静态页面，没有后端。
          浏览器直连需要服务商允许跨域。公共电脑请勿勾选「记住 Key」，用完点清除配置。
        </div>
        <div class="field">
          <label for="cfgPreset">服务商预设</label>
          <select class="select" id="cfgPreset">
            <option value="deepseek">DeepSeek</option>
            <option value="moonshot">Moonshot / Kimi</option>
            <option value="qwen">通义千问（兼容模式）</option>
            <option value="openai">OpenAI</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="field">
          <label for="cfgBase">Base URL</label>
          <input class="input" id="cfgBase" placeholder="https://api.deepseek.com/v1" spellcheck="false">
        </div>
        <div class="field">
          <label for="cfgKey">API Key</label>
          <div class="key-row">
            <input class="input" id="cfgKey" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off">
            <button class="btn-mini" id="keyToggle">显示</button>
          </div>
        </div>
      </div>
      <div>
        <div class="field">
          <label for="cfgModel">模型名</label>
          <input class="input" id="cfgModel" placeholder="deepseek-chat" spellcheck="false">
        </div>
        <div class="field">
          <label for="cfgPath">接口路径</label>
          <input class="input" id="cfgPath" spellcheck="false">
        </div>
        <div class="row-2">
          <div class="field">
            <label for="cfgTemp">temperature</label>
            <input class="input" id="cfgTemp" type="number" min="0" max="2" step="0.1">
          </div>
          <div class="field">
            <label for="cfgMaxTokens">max_tokens</label>
            <input class="input" id="cfgMaxTokens" type="number" min="64" max="16000" step="100">
          </div>
        </div>
        <label style="font-size:13.5px;color:var(--ink-soft);display:flex;gap:8px;align-items:center">
          <input type="checkbox" id="cfgRemember"> 记住 Key（本机）
        </label>
        <div class="actions" style="margin-top:14px">
          <button class="btn-outline" id="testBtn">测试连接</button>
          <div class="spacer"></div>
          <button class="btn-outline" id="resetCfg">清除配置</button>
        </div>
      </div>
    </div>
  </section>

  <div class="stage">

    <div class="left-col">

      <section class="panel context-panel">
        <div class="panel-title">
          <h2>对话上下文</h2>
          <span class="hint">本次会话</span>
        </div>
        <div class="context-list" id="contextList">
          <div class="context-empty" id="contextEmpty">还没有对话。写下题目，点「生成作文」，AI 的回应和作文会依次出现在这里。</div>
        </div>
      </section>

      <section class="panel input-panel">
        <div class="panel-title">
          <h2>输入</h2>
          <span class="hint">Ctrl + Enter 生成</span>
        </div>
        <div class="field">
          <label for="topic">作文题目 / 题材</label>
          <textarea class="textarea" id="topic" placeholder="例：老窑厂那批蛤蟆纹茶碗，老师傅守旧纹样，徒弟想换成招财猫"></textarea>
          <div class="examples">
            <button class="ex-chip" data-topic="窑上那批蛤蟆纹茶碗：老师傅守老纹样，小辈想改成招财的样式">蛤蟆纹茶碗</button>
            <button class="ex-chip" data-topic="老木匾上刻着「立马发财」，招牌要翻新，老师傅说这是倒反天罡">立马发财匾</button>
            <button class="ex-chip" data-topic="修伞铺最后一把伞，师父嘴上骂，夜里把伞骨换了新的">修伞铺</button>
          </div>
        </div>
        <details class="more-options">
          <summary>更多选项（学段、篇幅、额外要求）</summary>
          <div class="body">
            <div class="row-2">
              <div class="field">
                <label for="grade">学段</label>
                <select class="select" id="grade">
                  <option value="">不限</option>
                  <option value="小学">小学</option>
                  <option value="初中">初中</option>
                  <option value="高中">高中</option>
                </select>
              </div>
              <div class="field">
                <label for="length">篇幅</label>
                <select class="select" id="length">
                  <option value="约 800 字">约 800 字</option>
                  <option value="约 600 字">约 600 字</option>
                  <option value="约 1000 字">约 1000 字</option>
                  <option value="不限">不限</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="extra">额外要求 <span class="opt">（选填）</span></label>
              <input class="input" id="extra" placeholder="例：分歧落在一只碗的釉色上">
            </div>
          </div>
        </details>
        <div class="actions">
          <button class="btn btn-primary" id="genBtn">生成作文</button>
          <button class="btn-outline" id="stopBtn" disabled>停止</button>
          <button class="btn-outline" id="clearBtn">清空</button>
        </div>
        <div class="status-line" id="status" role="status"></div>
      </section>

    </div>

    <section class="paper-col">
      <div class="paper-bar">
        <h2>作文</h2>
        <div class="tools">
          <span class="paper-stat" id="paperStat"></span>
          <button class="btn-outline" id="copyBtn">复制</button>
          <button class="btn-outline" id="downloadBtn">下载 txt</button>
        </div>
      </div>
      <div class="paper">
        <div class="paper-inner">
          <div class="paper-title" id="paperTitle">作文稿纸</div>
          <div class="paper-body paper-empty" id="paperBody"></div>
        </div>
      </div>
    </section>

  </div>

</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="copyright">
      <span>文芽作文 · 保留所有权利</span>
      <span>生成内容仅供参考，请勿直接抄袭提交</span>
    </div>
  </div>
</footer>

<script src="assets/js/prompt.js?v=20261112"></script>
<script src="assets/js/write.js?v=20261112"></script>
</body>
</html>

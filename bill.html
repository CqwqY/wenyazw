<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="assets/img/wenya-icon.svg">
<meta name="theme-color" content="#123F2C">
<title>积分账单 - 文芽作文</title>
<meta name="description" content="文芽作文积分账单：按次合并的净扣明细、充值与兑换记录。">
<link rel="stylesheet" href="assets/css/style.css?v=20261128G">
<link rel="stylesheet" href="assets/css/write.css?v=20261128G">
<link rel="stylesheet" href="assets/css/mobile.css?v=20261128G">
<link rel="stylesheet" href="assets/css/credits.css?v=20261128G">
<link rel="stylesheet" href="assets/css/theme.css?v=20261128G">
<link rel="stylesheet" href="assets/css/bill.css?v=20261128G">
</head>
<body class="page-stick">

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/img/wenya-icon.svg" alt="文芽作文" width="30" height="30">
      <span>文芽作文</span>
    </a>
    <div class="account-area" id="accountArea"></div>
  </div>
</header>

<main class="wrap bill-wrap">
  <div class="tool-head">
    <div>
      <h1>积分账单</h1>
      <p>一次调用只记一条净扣。充值、兑换、退回都在这里。</p>
    </div>
    <a class="btn btn-ghost" href="index.html">返回工作台</a>
  </div>

  <section class="account-card" id="notLogged" hidden>
    <h2>请先登录</h2>
    <p>账单与账号绑定，登录后才能查看。</p>
    <button class="btn btn-primary" id="openLogin">登录 / 注册</button>
  </section>

  <section id="loggedPanel" hidden>
    <div class="bill-hero">
      <div>
        <span class="bill-hero-label">当前余额</span>
        <div class="bill-hero-num">
          <svg class="credit-coin" viewBox="0 0 16 16" width="26" height="26" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#d9a441" stroke="#a97b1f" stroke-width="1"/><circle cx="8" cy="8" r="2.6" fill="#fdf3dd"/></svg>
          <span id="billBalance">—</span><span class="bill-hero-unit">积分</span>
        </div>
      </div>
      <div class="bill-hero-side">
        <a class="btn btn-outline" href="credits.html">充值 / 兑换</a>
      </div>
    </div>

    <div class="bill-stats" id="billStats"></div>

    <div class="bill-panel">
      <div class="bill-panel-head">
        <h2>收支明细</h2>
        <div class="bill-filters">
          <button class="bill-filter active" data-filter="all" type="button">全部</button>
          <button class="bill-filter" data-filter="spend" type="button">支出</button>
          <button class="bill-filter" data-filter="income" type="button">收入</button>
          <button class="btn-outline" id="billRefresh" type="button">刷新</button>
        </div>
      </div>
      <div class="bill-list" id="billList"><div class="credit-empty">正在加载…</div></div>
      <p class="credit-foot">最近 100 条。每条 AI 调用已合并为一条净扣，不再分开显示预扣与补扣。</p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="copyright">
      <span>文芽作文 · 保留所有权利</span>
      <a href="terms.html">服务条款与免责声明</a>
    </div>
  </div>
</footer>

<div class="modal-mask" id="authMask" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="modal-head">
      <h2 id="authTitle">登录文芽作文</h2>
      <button class="modal-close" id="authClose" aria-label="关闭">×</button>
    </div>
    <div id="authMain">
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">登录</button>
        <button class="auth-tab" data-mode="register">注册</button>
      </div>
      <div class="auth-subtabs" id="authSubTabs">
        <button type="button" class="auth-subtab active" data-way="password">密码登录</button>
        <button type="button" class="auth-subtab" data-way="code">邮箱验证码</button>
      </div>
      <div id="authPwPane">
        <div class="field"><label for="authAccount">邮箱或用户名</label><input class="input" id="authAccount" type="text" autocomplete="username" maxlength="120"></div>
        <div class="field"><label for="authPassword">密码</label><input class="input" id="authPassword" type="password" autocomplete="current-password" maxlength="64"></div>
      </div>
      <div id="authCodePane" hidden>
        <div class="field" id="authUserField"><label for="authUser">用户名</label><input class="input" id="authUser" type="text" autocomplete="username" maxlength="24"></div>
        <div class="field"><label for="authEmail">邮箱</label><input class="input" id="authEmail" type="email" autocomplete="email" maxlength="120"></div>
        <div class="field"><label for="authCode">邮箱验证码</label><div class="code-row"><input class="input" id="authCode" type="text" inputmode="numeric" maxlength="6"><button class="btn-outline" id="sendCodeBtn" type="button">发送验证码</button></div><div class="auth-hint" id="codeHint">验证码 10 分钟内有效。</div></div>
        <div class="field" id="authRegPwField" hidden><label for="authRegPassword">设置密码（可选）</label><input class="input" id="authRegPassword" type="password" autocomplete="new-password" maxlength="64"></div>
      </div>
      <div class="auth-msg" id="authMsg"></div>
      <div class="modal-actions"><button class="btn btn-primary" id="authSubmit">登录</button></div>
    </div>
    <div id="authPwSet" hidden>
      <div class="auth-hint" id="pwSetHint">给账号加个密码，以后登录更方便。</div>
      <div class="field" id="pwOldField" hidden><label for="pwOld">原密码</label><input class="input" id="pwOld" type="password" autocomplete="current-password" maxlength="64"></div>
      <div class="field"><label for="pwNew">新密码</label><input class="input" id="pwNew" type="password" autocomplete="new-password" maxlength="64"></div>
      <div class="field"><label for="pwNew2">再输一次</label><input class="input" id="pwNew2" type="password" autocomplete="new-password" maxlength="64"></div>
      <div class="auth-msg" id="pwSetMsg"></div>
      <div class="modal-actions"><button class="btn btn-primary" id="pwSetSubmit" type="button">保存密码</button><button class="btn-outline" id="pwSetSkip" type="button">以后再说</button></div>
    </div>
  </div>
</div>

<script src="assets/js/auth.js?v=20261128G"></script>
<script src="assets/js/terms.js?v=20261128G"></script>
<script src="assets/js/bill.js?v=20261128G"></script>
</body>
</html>
